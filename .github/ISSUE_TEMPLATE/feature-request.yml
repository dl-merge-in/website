name: 機能要望
description: 改善案や新機能の提案を送ります。
title: "[要望]: "
body:
  - type: markdown
    attributes:
      value: |
        ご提案ありがとうございます。実現を約束するものではありませんが、今後の検討材料として確認します。

        DRMの回避、著作権侵害、サービスの利用規約違反につながる機能の要望は受け付けません。
  - type: textarea
    id: problem
    attributes:
      label: 解決したいこと
      description: 現在どのような点で困っているか、公開してよい範囲で説明してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能
      description: 期待する動作や画面のイメージを説明してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替手段
      description: 現在試している方法があれば記載してください。
  - type: checkboxes
    id: checklist
    attributes:
      label: 確認事項
      options:
        - label: 個人情報、ログイン情報、Cookie、アクセストークン、非公開URLを含めていません。
          required: true
        - label: DRMの回避や利用規約・法令違反を目的とする要望ではありません。
          required: true
